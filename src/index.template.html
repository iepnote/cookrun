<!DOCTYPE html>
<!-- 쿠킹런(요리 만들기) 앱 v36 — 단일 HTML / 기본 요리 12종 + 교사 제작 요리 -->
<!-- 편집은 src/index.template.html 에서. 빌드: python3 tools/build.py 가 assets/ 의 그림·폰트를 넣어 index.html 생성 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">   <!-- 학급용: 검색 비노출 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>요리를 만들어요</title>
<style>
@font-face{font-family:'NanumSquareNeo';font-style:normal;font-weight:400;font-display:swap;src:url(@@FONT:font1.woff2@@) format('woff2');}
@font-face{font-family:'NanumSquareNeo';font-style:normal;font-weight:700 900;font-display:swap;src:url(@@FONT:font2.woff2@@) format('woff2');}

  :root{
    --bg:#f4efe6; --panel:#fffdf8; --ink:#3a3128; --soft:#7a6f60;
    --accent:#7bae7f; --accent-d:#5d8f63; --hi:#ffd56b; --line:#e3d9c8;
    --pad:2.2vmin; --gap:2vmin; --r:2.4vmin; --fz:clamp(18px,3.4vmin,46px); --fsx:1;
    /* 크기 토큰 — 손:도구:음식:그릇 = 1:2:3:5 (설계 §1-1) */
    --sz-hand:10vmin; --sz-tool:20vmin; --sz-knife:36vmin; --sz-food:30vmin; --sz-ing:16vmin; --sz-vessel:50vmin; --sz-bit:5vmin;
    --titleW:clamp(380px,62vmin,820px);   /* 타이틀 박스 고정 크기(글자수 무관) */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  img{ -webkit-user-drag:none; user-select:none; }
  html{height:100%;background:#f4efe6 center/cover fixed;}
  body{margin:0;height:100%;overflow:hidden;background:rgba(250,247,240,.30);
    font-family:"NanumSquareNeo","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink); touch-action:none; user-select:none; -webkit-user-select:none;}
  body.finger, body.finger *{cursor:none !important;}
  #cursor{position:fixed;left:0;top:0;width:clamp(48px,8vmin,108px);z-index:9999;
    pointer-events:none;display:none;transform:translate(-22%,0%);filter:drop-shadow(0 .4vmin .6vmin rgba(0,0,0,.25));}
  #app{position:fixed;inset:0;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:var(--pad);gap:var(--gap);}
  .screen.on{display:flex;}
  .big-btn{font-size:calc(clamp(22px,4.4vmin,60px)*var(--fsx));font-weight:800;color:#fff;
    background:var(--accent);border:none;border-radius:var(--r);
    padding:clamp(14px,2.6vmin,40px) clamp(28px,6vmin,90px);cursor:pointer;
    box-shadow:0 1vmin 0 var(--accent-d);transition:transform .08s;}
  .big-btn:active{transform:translateY(.6vmin);box-shadow:0 .4vmin 0 var(--accent-d);}
  .title{font-size:calc(clamp(24px,5.2vmin,72px)*var(--fsx));font-weight:900;text-align:center;
    background:rgba(255,255,255,.62);border-radius:2.6vmin;padding:.32em .9em;
    box-shadow:0 .5vmin 1.6vmin rgba(0,0,0,.12);width:var(--titleW);max-width:94vw;box-sizing:border-box;white-space:normal;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .longtxt{font-size:calc(clamp(22px,4.8vmin,64px)*var(--fsx)*.8)!important;}
  .title,#headline,.guide,.bubblehint,.nm{word-break:keep-all;}
  .sub{font-size:calc(var(--fz)*var(--fsx));color:var(--soft);text-align:center;font-weight:700;}

  /* 네비게이션 바 */
  #nav{position:fixed;top:0;left:0;right:0;height:8vmin;min-height:50px;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:1vmin;padding:0 1.4vmin;
    background:var(--accent);color:#fff;box-shadow:0 .4vmin 1vmin rgba(0,0,0,.18);}
  .nav-c{display:flex;gap:1vmin;} .nav-r{display:flex;gap:1vmin;}
  .nav-b{font-size:clamp(18px,3.4vmin,36px);line-height:1;color:#fff;cursor:pointer;font-weight:800;
    background:rgba(255,255,255,.2);border:none;border-radius:1.4vmin;
    min-width:clamp(44px,7vmin,76px);height:clamp(42px,6.6vmin,70px);padding:0 1vmin;}
  .nav-b.txt{font-size:clamp(15px,2.8vmin,32px);padding:0 1.6vmin;}
  .nav-b:active{transform:scale(.92);}

  /* 고정 안내박스(선 없이) — 문장만 바뀜 */
  #headline{position:fixed;top:9.5vmin;left:50%;transform:translateX(-50%);z-index:25;text-align:center;display:none;
    font-weight:900;font-size:calc(clamp(22px,4.8vmin,64px)*var(--fsx));color:var(--ink);
    background:rgba(255,255,255,.62);border-radius:2.6vmin;box-shadow:0 .5vmin 1.6vmin rgba(0,0,0,.12);
    padding:.35em 1em;pointer-events:none;width:var(--titleW);max-width:94vw;box-sizing:border-box;white-space:normal;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  #s-start,#s-done{padding-top:9vmin;}
  #s-start{justify-content:space-between;padding-bottom:6vmin;}
  #s-start .title{position:relative;z-index:2;} #s-start #btn-start{position:relative;z-index:2;}
  #hero-start{position:static;}
  #s-select,#s-cart,#s-prep,#s-review,#s-intro{padding-top:22vmin;justify-content:flex-start;}

  /* 요리사 선택(시작 화면) */
  .chefrow{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center;} #chefs{flex-direction:column;align-items:center;gap:1vmin;position:relative;z-index:2;}
  .chef{display:flex;flex-direction:column;align-items:center;gap:.4vmin;cursor:pointer;padding:1.6vmin 1.4vmin .6vmin;border-radius:2vmin;border:.5vmin solid transparent;}
  .chef.sel{border-color:var(--accent);background:rgba(255,255,255,.6);}
  /* 손님 주문 */
  .orderbubble{display:flex;flex-direction:column;align-items:center;gap:1vmin;background:#fffdf8;border:.5vmin solid var(--line);border-radius:3vmin;padding:2vmin 3vmin;box-shadow:0 .6vmin 1.6vmin rgba(0,0,0,.12);position:relative;}
  .orderbubble:before{content:"";position:absolute;left:-2.2vmin;top:50%;border:1.2vmin solid transparent;border-right:1.4vmin solid #fffdf8;transform:translateY(-50%);}
  #headcust{position:fixed;top:8.6vmin;left:calc(50% - var(--titleW)/2 - 9vmin);z-index:26;}
  .card .cardemoji{font-size:8vmin;width:100%;height:100%;}
  /* 요리 도감 */
  #bookgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vmin;width:min(96vw,1000px);margin-bottom:6vmin;}
  .bk{background:rgba(255,253,248,.94);border:.6vmin solid var(--line);border-radius:var(--r);padding:1.2vmin;display:flex;flex-direction:column;align-items:center;gap:.6vmin;position:relative;}
  .bk .art{width:16vmin;height:16vmin;display:flex;align-items:center;justify-content:center;overflow:hidden;} .bk .art>*{max-width:100%;max-height:100%;}
  .bk:not(.got) .art{filter:grayscale(1);opacity:.35;}
  .bk .cnt{position:absolute;top:.6vmin;right:.6vmin;background:var(--hi);color:#6b4e00;font-weight:900;border-radius:1.2vmin;padding:.2vmin .8vmin;font-size:clamp(12px,2.2vmin,22px);}
  #stamp{position:absolute;right:12%;top:22%;width:18vmin;height:18vmin;border:1vmin solid #d33;border-radius:50%;color:#d33;font-weight:900;font-size:3.2vmin;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);background:rgba(255,255,255,.5);z-index:5;animation:stampin .45s cubic-bezier(.2,1.4,.4,1);pointer-events:none;}
  #stamp.first{border-color:#d4a017;color:#b8860b;box-shadow:0 0 2vmin #ffd56b;}
  @keyframes stampin{from{transform:rotate(-12deg) scale(3);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
  /* 깜짝 요소 */
  .steam{position:absolute;width:4vmin;height:4vmin;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(.6vmin);pointer-events:none;z-index:9;transition:transform 1.6s ease-out,opacity 1.6s;}
  .pantry.gold{border-color:#d4a017;animation:goldglow 1.2s ease-in-out infinite alternate;} @keyframes goldglow{from{box-shadow:0 0 1vmin #ffd56b}to{box-shadow:0 0 3vmin 1vmin #ffd56b}}
  #cat{position:absolute;left:6%;bottom:24%;z-index:3;transform:translateY(120%);transition:transform .6s ease-out;pointer-events:none;} #cat.up{transform:translateY(0);}
  /* 수도꼭지 손잡이 */
  .knob{position:absolute;width:var(--sz-hand);height:var(--sz-hand);transform:translate(-50%,-50%);z-index:12;cursor:grab;touch-action:none;}
  .knobdisc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#dfe6ee,#8d9aa8);border:.5vmin solid #5c6b7a;box-shadow:0 .4vmin .8vmin rgba(0,0,0,.3);}
  .knobdisc:after{content:"";position:absolute;left:46%;top:8%;width:8%;height:40%;background:#3a4653;border-radius:1vmin;}
  .knob>[data-hand]{position:absolute;left:50%;top:60%;transform:translate(-50%,0);opacity:.9;pointer-events:none;}
  .knob.on .knobdisc{background:radial-gradient(circle at 40% 35%,#bfe3ff,#4b9ad8);}
  .stain{position:absolute;width:14%;height:12%;border-radius:50%;background:rgba(120,80,40,.45);transition:opacity .3s;}
  /* 모달 */
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:200;
    display:none;align-items:center;justify-content:center;}
  .modal-back.on{display:flex;}
  .modal{background:var(--panel);border-radius:var(--r);padding:clamp(16px,3vmin,40px);
    width:min(86vw,560px);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:2vmin;box-shadow:0 2vmin 6vmin rgba(0,0,0,.3);}
  .modal.pop{align-items:center;gap:3vmin;animation:popin .3s;}
  @keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .m-title{font-size:clamp(24px,4.4vmin,52px);font-weight:900;text-align:center;}
  .m-row{display:flex;flex-direction:column;gap:1vmin;}
  .m-row>span{font-size:clamp(16px,3vmin,32px);font-weight:800;}
  .seg{display:flex;gap:1vmin;}
  .seg button{flex:1;font-size:clamp(14px,2.6vmin,28px);font-weight:800;padding:1.2vmin .4vmin;
    border:.5vmin solid var(--line);background:#fff;border-radius:1.6vmin;cursor:pointer;color:var(--ink);}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent-d);}

  /* 진행 띠 */
  #band{position:absolute;top:8vmin;left:0;right:0;display:flex;justify-content:center;
    gap:1.4vmin;padding:1.2vmin;background:rgba(255,253,248,.92);border-bottom:.4vmin solid var(--line);z-index:30;}
  #band.hide{display:none;}
  .dot{width:clamp(26px,5.4vmin,64px);height:clamp(26px,5.4vmin,64px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:800;
    font-size:clamp(13px,2.6vmin,30px);background:#ece3d4;color:var(--soft);transition:.2s;}
  .dot.cur{background:var(--accent);color:#fff;transform:scale(1.12);box-shadow:0 0 0 .6vmin #cfe3d1;}
  .dot.done{background:var(--hi);color:#6b4e00;}

  /* 단계 */
  .stage{position:absolute;top:17vmin;left:0;right:0;bottom:0;display:flex;
    flex-direction:column;align-items:center;justify-content:flex-start;padding:1.2vmin;gap:1vmin;}
  .guide{font-size:calc(clamp(24px,5vmin,70px)*var(--fsx));font-weight:900;text-align:center;line-height:1.2;
    background:rgba(255,255,255,.62);border-radius:2.4vmin;padding:.3em .8em;box-shadow:0 .5vmin 1.4vmin rgba(0,0,0,.12);
    width:var(--titleW);max-width:80vw;box-sizing:border-box;white-space:normal;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .speak{font-size:clamp(24px,5vmin,60px);background:var(--panel);border:.5vmin solid var(--line);
    border-radius:50%;width:clamp(48px,9vmin,110px);height:clamp(48px,9vmin,110px);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .speak:active{transform:scale(.92);}
  .work{flex:1 1 auto;width:100%;max-width:1240px;position:relative;
    display:flex;align-items:center;justify-content:center;}
  .hintglow{animation:glow 1.3s ease-in-out infinite;}
  @keyframes glow{0%,100%{box-shadow:0 0 0 rgba(255,213,107,0)}50%{box-shadow:0 0 3vmin 1vmin rgba(255,200,80,.85)}}
  @keyframes float{0%{transform:translateY(0)}100%{transform:translateY(-1.6vmin)}}

  /* 가로 배치: 접시 항상 중앙, 재료패널은 오른쪽에 떠 있게(접시 안 밀림) */
  .cookrow{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
  .sidetray{position:absolute;right:1vmin;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:1.6vmin;align-items:center;max-height:96%;}
  .ingtray{display:flex;gap:2.4vmin;justify-content:center;align-items:flex-end;flex-wrap:wrap;width:100%;}
  .tray-item{cursor:grab;touch-action:none;position:relative;background:rgba(255,255,255,.55);
    border-radius:2vmin;padding:1vmin;}
  .tray-item img{width:100%;pointer-events:none;}
  .nm{font-weight:800;font-size:clamp(15px,2.8vmin,30px);}

  .pick{background:var(--panel);border:.6vmin solid var(--line);border-radius:var(--r);
    padding:1.4vmin;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.6vmin;
    transition:transform .12s;width:clamp(130px,24vmin,250px);}
  .pick img{width:90%;height:17vmin;max-height:150px;object-fit:contain;pointer-events:none;}
  .pick.sel{border-color:var(--accent);background:#eef6ee;transform:translateY(-1.2vmin);}
  .pick .nm{font-size:calc(clamp(16px,3vmin,34px)*var(--fsx));font-weight:800;}
  .drag{touch-action:none;cursor:grab;position:absolute;will-change:transform;}
  .drag img{width:100%;pointer-events:none;}
  .target-out{position:absolute;border:.6vmin dashed var(--accent);border-radius:2vmin;}

  .toast{position:absolute;top:19vmin;left:50%;transform:translateX(-50%) scale(.6);opacity:0;
    background:var(--accent);color:#fff;font-weight:900;font-size:clamp(22px,4.6vmin,56px);
    padding:1.4vmin 3.4vmin;border-radius:3vmin;z-index:40;pointer-events:none;transition:.25s;}
  .toast.show{opacity:1;transform:translateX(-50%) scale(1);}

  /* 접시 무대(통일 크기) */
  .plate-stage{position:relative;width:var(--sz-vessel);}
  .toolstart{position:absolute;right:4%;bottom:4%;z-index:40;touch-action:none;}
  .plate-stage>img.plate{width:100%;display:block;}
  .sand{position:absolute;left:20%;right:20%;width:60%;bottom:28%;}
  .sand>img.base{width:100%;display:block;}
  /* 재료는 식빵보다 10% 작게(가로 90%), 차곡차곡 겹치도록 얇은 높이 */
  .sand>img.lyr{position:absolute;object-fit:contain;object-position:center bottom;}  /* 재료별 자연 비율(왜곡 없음) — 크기·위치는 lyrHTML()이 재료별로 지정 */
  .land{animation:pop .35s;}
  /* 순서 설명 카드 */
  #intro-cards{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center;max-width:1140px;margin-bottom:2vmin;}
  .introcard{display:flex;flex-direction:column;align-items:center;gap:.6vmin;width:clamp(96px,15vmin,180px);}
  .introbox{width:100%;aspect-ratio:1;border-radius:1.6vmin;background:var(--panel);border:.5vmin solid var(--line);
    overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .introbox img{width:100%;height:100%;object-fit:contain;}
  .introlb{font-weight:800;font-size:calc(clamp(13px,2.4vmin,26px)*var(--fsx));text-align:center;}
  .cardemoji{display:flex;align-items:center;justify-content:center;line-height:1;}
  /* POV(1인칭 시점) 무대 — 도마가 비스듬히 보이고(각도), 도구는 내 손처럼 */
  .device{text-align:center;padding-bottom:6vmin;}
  .pov{position:relative;width:clamp(300px,62vmin,680px);height:clamp(280px,54vmin,580px);
    perspective:130vmin;perspective-origin:50% 26%;display:flex;align-items:center;justify-content:center;margin-top:1vmin;}
  .board3d{position:absolute;left:6%;right:6%;top:30%;height:58%;border-radius:7vmin;
    background:linear-gradient(160deg,#e9cd97,#d6b277);
    box-shadow:0 5vmin 7vmin rgba(0,0,0,.28),inset 0 0 4vmin rgba(255,255,255,.25);
    transform:rotateX(48deg);transform-origin:50% 65%;}
  .povact{position:absolute;inset:0;cursor:grab;touch-action:none;z-index:6;}
  .povhint{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:7;font-weight:900;
    font-size:calc(clamp(18px,3.6vmin,40px)*var(--fsx));color:var(--ink);
    text-shadow:0 .3vmin 0 #fff,0 0 1.4vmin #fff;white-space:nowrap;pointer-events:none;}
  .povfood{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:3;line-height:1;
    width:var(--sz-food);height:var(--sz-food);font-size:clamp(120px,28vmin,300px);
    display:flex;align-items:center;justify-content:center;text-align:center;}
  .povfood>.cardemoji{position:absolute;inset:0;font-size:.36em;transition:transform .06s;}
  .gimg{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 1vmin 1vmin rgba(0,0,0,.18));}
  .tool{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
    width:var(--sz-tool);height:var(--sz-tool);font-size:clamp(70px,16vmin,180px);
    display:flex;align-items:center;justify-content:center;will-change:transform;pointer-events:none;}
  #ring{position:absolute;left:50%;top:46%;width:28vmin;height:28vmin;transform:translate(-50%,-50%);
    border:.6vmin dashed var(--accent);border-radius:50%;opacity:.55;z-index:2;pointer-events:none;}
  #fill{position:absolute;left:32%;right:32%;bottom:48%;height:0;background:#ffe08a;border-radius:50%;transition:height .12s;}  /* 팬 가운데 반죽 웅덩이 */
  #stream{position:absolute;left:50%;top:24%;width:1.6vmin;height:24vmin;background:linear-gradient(#fff,#ffe9a8);transform:translateX(-50%);
    opacity:0;border-radius:1vmin;transition:opacity .1s;z-index:2;pointer-events:none;}  /* 반죽 줄기 = 팬 중앙 */
  #knife{transform-origin:50% 0;}
  .bubble{position:absolute;width:2.6vmin;height:2.6vmin;border-radius:50%;background:rgba(255,255,255,.9);
    border:.2vmin solid #cfe6f3;transition:transform .6s ease-out,opacity .6s;z-index:3;pointer-events:none;}
  .drop{position:absolute;width:1.7vmin;height:2.2vmin;background:radial-gradient(circle at 35% 30%,#bfe6ff,#6fbdf0);
    border-radius:60% 60% 60% 60%/72% 72% 40% 40%;opacity:.95;z-index:4;pointer-events:none;
    transition:transform .55s cubic-bezier(.3,.7,.5,1),opacity .55s;}

  /* 손 씻기 — 크게, 세면대 고정 */
  #sink{position:relative;width:clamp(320px,60vmin,640px);height:clamp(220px,42vmin,460px);overflow:hidden;
    background:#dceef7;border:.6vmin solid #b9d9ea;border-radius:4vmin;cursor:grab;touch-action:none;
    display:flex;align-items:center;justify-content:center;}
  #foam{position:absolute;left:0;right:0;bottom:0;height:0;opacity:.9;transition:height .15s;
    background:repeating-radial-gradient(circle at 20% 30%,#fff 0 6%,#eaf4fb 6% 12%);}
  #washimg{width:74%;max-width:420px;z-index:1;}
  #washcount{margin-top:.6vmin;font-weight:900;font-size:clamp(26px,5.4vmin,66px);color:#3a6ea5;
    text-shadow:0 .3vmin 0 #fff,0 0 1.4vmin #fff;letter-spacing:.2vmin;}

  /* 복습 카드 크게 */
  #slots,#tray2{display:flex;gap:1.2vmin;flex-wrap:wrap;justify-content:center;}
  #tray2{margin-top:1vmin;}
  .slot{width:clamp(92px,21vmin,300px);height:clamp(92px,21vmin,300px);border-radius:2vmin;
    border:.6vmin dashed var(--line);display:flex;align-items:center;justify-content:center;

  /* 요리 고르기 */
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.6vmin;width:100%;max-width:1100px;}

  .dish.soon{opacity:.5;}
  .dish .tag{position:absolute;top:.4vmin;right:.4vmin;background:#c3b6a6;color:#fff;
    font-size:clamp(10px,1.8vmin,18px);padding:.2vmin .8vmin;border-radius:1vmin;font-weight:800;}

  /* 재료 고르기 — 위 6×2 카드, 아래 테이블 위 바구니 / 상단 레시피 카드 계속 표시 */
  #s-cart{padding-top:25vmin;}   /* 타이틀 박스 아래로 더 내림 */
  #cart-wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2vmin;width:100%;}
  #recipe-strip{margin:1.5vmin 0 1.5vmin;}
  #recipe-strip{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1vmin;
    background:rgba(255,253,248,.94);border:.5vmin solid var(--line);border-radius:2vmin;padding:.8vmin 1.6vmin;max-width:96vw;}
  #recipe-strip .rlabel{font-weight:900;font-size:clamp(14px,2.4vmin,28px);color:var(--accent-d);margin-right:.6vmin;}
  #recipe-strip .rchip{display:inline-flex;align-items:center;gap:.4vmin;font-weight:800;font-size:clamp(13px,2.2vmin,24px);
    background:#fff;border:.3vmin solid var(--line);border-radius:1.4vmin;padding:.2vmin .8vmin;}
  #recipe-strip .rchip img{width:clamp(22px,4vmin,46px);height:clamp(22px,4vmin,46px);object-fit:contain;}
  #recipe-strip .rchip .rem{font-size:clamp(18px,3.4vmin,34px);}
  #grid12{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2.4vmin 2.2vmin;width:100%;max-width:1120px;}
  #grid12 .pantry{width:100%;height:clamp(72px,13vmin,140px);}
  /* 레시피 확인 화면 — 좌(재료) · 중앙(요리 크게+이름) · 우(순서), 스크롤 없음 */
  #s-intro{padding-top:9.5vmin;justify-content:flex-start;gap:1vmin;}
  #recipe-title{font-weight:900;font-size:calc(clamp(22px,4.6vmin,58px)*var(--fsx));text-align:center;
    text-shadow:0 .3vmin 0 #fff,0 0 1.8vmin #fff;flex:0 0 auto;}
  #recipe-wrap{display:flex;gap:1.8vmin;align-items:stretch;justify-content:center;width:100%;max-width:1320px;flex:1 1 auto;min-height:0;}
  #recipe-need,#recipe-order{flex:1 1 0;min-width:0;min-height:0;}
  #recipe-center{flex:1.6 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8vmin;min-width:0;min-height:0;}
  #recipe-hero{flex:0 1 auto;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;}
  #recipe-hero>div{max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;}
  #recipe-hero img{width:auto!important;height:auto;max-width:100%;max-height:56vmin;display:block;}
  #recipe-hero .cardemoji{line-height:1;font-size:min(34vmin,44vh);}
  #recipe-name{font-weight:900;font-size:calc(clamp(22px,4.4vmin,52px)*var(--fsx));text-align:center;color:var(--ink);
    background:rgba(255,253,248,.92);border-radius:1.8vmin;padding:.5vmin 2.6vmin;flex:0 0 auto;}
  .rcard{background:rgba(255,253,248,.96);border:.5vmin solid var(--line);border-radius:2vmin;
    padding:1.6vmin 1.4vmin;display:flex;flex-direction:column;min-height:0;}
  .rcard h4{margin:.2vmin 0 1.4vmin;font-size:clamp(18px,3.4vmin,40px);font-weight:900;color:var(--accent-d);text-align:center;flex:0 0 auto;}
  #recipe-need .needrow{display:flex;flex-direction:column;gap:1.6vmin;flex:1 1 auto;justify-content:center;}
  .needchip{display:flex;align-items:center;gap:1.6vmin;font-weight:800;font-size:clamp(17px,3.2vmin,40px);cursor:pointer;
    border-radius:1.6vmin;padding:.4vmin .6vmin;transition:transform .1s,background .1s;}
  .needchip:active{transform:scale(.96);background:#eef6ee;}
  .needchip .ic{width:clamp(48px,8.8vmin,108px);height:clamp(48px,8.8vmin,108px);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .needchip .ic img{max-width:100%;max-height:100%;object-fit:contain;}
  .needchip .ic .cardemoji{font-size:clamp(34px,6.6vmin,78px);}
  #recipe-order .orow{display:flex;flex-direction:column;gap:.9vmin;flex:1 1 auto;justify-content:center;}
  .ostep{display:flex;align-items:center;gap:1.3vmin;cursor:pointer;border-radius:1.6vmin;padding:.3vmin .5vmin;transition:transform .1s,background .1s;}
  .ostep:active{transform:scale(.97);background:#eef6ee;}
  .ostep .obox{width:clamp(46px,8.2vmin,86px);height:clamp(46px,8.2vmin,86px);border-radius:1.4vmin;background:var(--panel);
    border:.4vmin solid var(--line);overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .ostep .obox img{width:100%;height:100%;object-fit:contain;} .ostep .obox .cardemoji{font-size:clamp(20px,4vmin,44px);}
  .ostep .olb{font-weight:800;font-size:clamp(16px,3vmin,36px);}
  .pantry{position:relative;background:rgba(255,253,248,.94);border:.6vmin solid var(--line);border-radius:2vmin;
    padding:.8vmin;cursor:pointer;display:flex;flex-direction:column;align-items:center;
    width:clamp(82px,15vmin,168px);height:clamp(96px,17vmin,184px);transition:transform .15s,box-shadow .15s,border-color .15s;will-change:transform;}
  .pantry:active{transform:scale(.96);}
  /* 선택됨: 카드가 살짝 튀어나옴 + 체크 */
  .pantry.sel{transform:translateY(-1.8vmin) scale(1.05);border-color:var(--accent);
    background:#eef7ef;box-shadow:0 1.4vmin 2.6vmin rgba(0,0,0,.22);}
  .pantry.sel::after{content:"✓";position:absolute;top:-.6vmin;right:-.6vmin;background:var(--accent);color:#fff;
    width:clamp(22px,3.8vmin,44px);height:clamp(22px,3.8vmin,44px);border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-weight:900;font-size:clamp(13px,2.6vmin,28px);box-shadow:0 .3vmin .6vmin rgba(0,0,0,.2);}
  .pantry.got{opacity:.35;pointer-events:none;}
  .pantry .picwrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;}
  .pantry .picwrap img{max-width:94%;max-height:100%;object-fit:contain;pointer-events:none;}
  .pantry .em{font-size:clamp(40px,9vmin,96px);line-height:1;}
  .pantry .pn{flex:0 0 auto;font-size:calc(clamp(14px,2.6vmin,30px)*var(--fsx));font-weight:800;padding-top:.4vmin;}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-1.4vmin)}40%,80%{transform:translateX(1.4vmin)}}
  /* 제스처 재미 요소(공용) */
  .sparkle{position:absolute;pointer-events:none;z-index:30;font-size:4.4vmin;line-height:1;transition:transform .6s ease-out,opacity .6s;}
  .pipbar{position:absolute;left:50%;bottom:1.6vmin;transform:translateX(-50%);display:flex;gap:1.2vmin;z-index:20;pointer-events:none;}
  .pip{width:2.4vmin;height:2.4vmin;border-radius:50%;background:rgba(0,0,0,.16);transition:background .2s,transform .2s;}
  .pip.on{background:var(--accent);transform:scale(1.25);box-shadow:0 0 1.4vmin rgba(255,200,80,.7);}
  .squish{animation:squish .32s ease;}
  @keyframes squish{0%{transform:scale(1,1)}40%{transform:scale(1.18,.78)}70%{transform:scale(.9,1.1)}100%{transform:scale(1,1)}}
  /* 손 연출 + 자르기 섬광 */
  .gripslot{position:absolute;left:50%;bottom:-1vmin;transform:translateX(-50%);z-index:3;pointer-events:none;}
  .cutflash{position:absolute;top:18%;bottom:26%;width:.8vmin;background:#fff;border-radius:1vmin;opacity:.95;z-index:7;pointer-events:none;transition:opacity .35s;filter:drop-shadow(0 0 1vmin #fff);}
  @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}  /* 살짝 튀며 착지(오버슈트) */

  /* 말풍선 안내(지시문 공용) */
  @keyframes bfloat{0%{transform:translate(-50%,0)}100%{transform:translate(-50%,-1vmin)}}
  .bubblehint{position:absolute;left:50%;top:-2vmin;transform:translateX(-50%);z-index:8;
    background:#fffdf8;border:.45vmin solid var(--line);border-radius:3vmin;padding:.9vmin 2vmin;
    font-weight:800;font-size:clamp(14px,2.7vmin,30px);color:var(--ink);white-space:nowrap;
    box-shadow:0 .5vmin 1.2vmin rgba(0,0,0,.12);pointer-events:none;
    animation:bfloat .9s ease-in-out infinite alternate;text-shadow:none;}
  .bubblehint:after{content:"";position:absolute;left:50%;bottom:-1.7vmin;transform:translateX(-50%);
    border:.9vmin solid transparent;border-top:1.8vmin solid #fffdf8;border-bottom:none;
    filter:drop-shadow(0 .45vmin 0 var(--line));}

  /* 유령 손 시범(수준 가·나) + 힌트 숨김(수준 다) */
  .ghost{position:absolute;left:50%;top:45%;z-index:60;opacity:.55;pointer-events:none;transform:translate(-50%,-50%);}
  .ghost-lr{animation:g-lr 1.2s ease-in-out infinite alternate;} @keyframes g-lr{from{transform:translate(-110%,-50%)}to{transform:translate(10%,-50%)}}
  .ghost-circle{animation:g-circ 1.6s linear infinite;} @keyframes g-circ{from{transform:translate(-50%,-50%) rotate(0) translateX(9vmin) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg) translateX(9vmin) rotate(-360deg)}}
  .ghost-down{animation:g-down 1.1s ease-in infinite;} @keyframes g-down{from{transform:translate(-50%,-120%)}to{transform:translate(-50%,20%)}}
  .ghost-up{animation:g-up .8s ease-out infinite;} @keyframes g-up{from{transform:translate(-50%,10%)}to{transform:translate(-50%,-120%)}}
  .ghost-tap{animation:g-tap .7s ease-in-out infinite alternate;} @keyframes g-tap{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(.8)}}
  .ghost-drag{animation:g-drag 1.6s ease-in-out infinite;} @keyframes g-drag{from{transform:translate(60%,-50%)}to{transform:translate(-50%,-50%)}}
  body.nohint .bubblehint,body.nohint .povhint{display:none;} body.nohint .hintglow{animation:none;}
  /* 위치 편집기 */
  body.editing [data-edit]{outline:.3vmin dashed #2a7;}
  body.editing .ed-sel{outline:.5vmin solid #e0392b !important;}
  #editinfo{position:fixed;left:1vmin;bottom:1.4vmin;z-index:300;background:rgba(0,0,0,.82);color:#fff;
    border-radius:1.2vmin;padding:1.2vmin;font-size:clamp(12px,2vmin,20px);max-width:60vw;display:none;white-space:pre-line;}
  @media (orientation:portrait){ .ingtray{gap:1.4vmin;} .cookrow{flex-direction:column;}
    .sidetray{position:static;transform:none;flex-direction:row;flex-wrap:wrap;justify-content:center;margin-top:2vmin;}
    #cart-wrap{flex-direction:column;} #grid12{grid-template-columns:repeat(4,minmax(0,1fr));}
    #recipe-wrap{flex-direction:column;align-items:center;gap:1.2vmin;}
    #recipe-need,#recipe-order,#recipe-center{flex:0 0 auto;width:100%;max-width:640px;}
    #recipe-center{order:-1;} #recipe-need .needrow{flex-direction:row;flex-wrap:wrap;justify-content:center;} }
  /* 교사용 새 요리 편집기 */
  #s-edit{justify-content:flex-start;padding-top:20vmin;overflow-y:auto;}
  #editbody{width:min(92vw,940px);margin:0 auto;padding-bottom:8vmin;}
  .edcard{background:#fff;border-radius:2.4vmin;box-shadow:0 .6vmin 2vmin rgba(0,0,0,.08);padding:2.4vmin 3vmin;margin:0 0 2.4vmin;}
  .edtitle{font-weight:900;font-size:clamp(15px,2.8vmin,30px);margin-bottom:1.4vmin;}
  .edtitle small{font-weight:700;opacity:.55;font-size:.75em;}
  .edrow{display:flex;flex-wrap:wrap;gap:1.2vmin;align-items:center;}
  .edchip{display:flex;align-items:center;gap:.8vmin;padding:1vmin 1.6vmin;border-radius:1.6vmin;border:.35vmin solid #ddd;
    background:#fafafa;cursor:pointer;font-weight:800;font-size:clamp(13px,2.4vmin,26px);user-select:none;}
  .edchip:active{transform:scale(.96);}
  .edchip.sel{border-color:#4a9f7f;background:#eaf6f0;}
  #ed-nm{width:100%;box-sizing:border-box;font:inherit;font-weight:800;font-size:clamp(16px,3vmin,32px);
    padding:1.2vmin 1.6vmin;border:.4vmin solid #ddd;border-radius:1.6vmin;}
  .edin{box-sizing:border-box;font:inherit;font-weight:800;font-size:clamp(14px,2.6vmin,28px);
    padding:1vmin 1.4vmin;border:.4vmin solid #ddd;border-radius:1.4vmin;}
  .big-btn.sm{font-size:clamp(14px,2.6vmin,26px);padding:1.2vmin 2.6vmin;box-shadow:0 .7vmin 0 rgba(0,0,0,.15);}
  .ednote{background:#fff6e8;border:.35vmin solid #eccb96;border-radius:1.4vmin;padding:1.4vmin 1.8vmin;margin-top:1.2vmin;
    font-size:clamp(13px,2.2vmin,24px);font-weight:700;line-height:1.5;}
  .ednote textarea{width:100%;box-sizing:border-box;font:inherit;font-weight:600;font-size:.92em;margin-top:.8vmin;
    border:.3vmin solid #ddd;border-radius:1vmin;padding:1vmin;background:#fff;}
  .edthumb{width:9vmin;height:9vmin;object-fit:cover;border-radius:1.4vmin;border:.35vmin solid #ddd;vertical-align:middle;}
  .dish.custom{position:relative;border:.55vmin dashed #e08c3c;}
  .dish .delbadge{position:absolute;right:.8vmin;top:.8vmin;font-size:3.4vmin;line-height:1;background:#fff;
    border-radius:50%;padding:.7vmin;box-shadow:0 .3vmin 1vmin rgba(0,0,0,.22);z-index:3;cursor:pointer;}
</style>

<body>
<img id="cursor" alt="">
<div id="app">
  <div id="nav">
    <button class="nav-b" id="nav-home" aria-label="처음으로">🏠</button>

<script>
"use strict";
const SET={vol:0.8, voice:"female", fs:1, sfx:true, tts:true, vib:true, order:true};
function settingsSave(){ try{localStorage.setItem("cookrun_set",JSON.stringify(SET));}catch(_){ } }
function settingsLoad(){ try{Object.assign(SET,JSON.parse(localStorage.getItem("cookrun_set")||"{}"));}catch(_){ }
  document.documentElement.style.setProperty("--fsx",SET.fs); }
settingsLoad();
function vib(p){ if(!SET.vib)return; try{navigator.vibrate(p);}catch(_){ } }

/* 손가락 커서 */
(function(){ const cur=document.getElementById("cursor"); cur.src=IMG.cursor||"";
  window.addEventListener("pointermove",e=>{ if(e.pointerType==="mouse"&&IMG.cursor){
    document.body.classList.add("finger"); cur.style.display="block";
    cur.style.left=e.clientX+"px"; cur.style.top=e.clientY+"px"; }},{passive:true});
  window.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse"){
    document.body.classList.remove("finger"); cur.style.display="none"; }});
})();

/* 사운드 */
let AC=null; function ac(){return AC||(AC=new (window.AudioContext||window.webkitAudioContext)());}
function beep(f=660,dur=.16,type="sine",vol=.25,delay=0){
  if(SET.vol<=0||!SET.sfx) return;
  try{const c=ac();const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);
  const v=vol*SET.vol; const t=c.currentTime+delay;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02);}catch(e){}
}
/* ===== 효과음 (설계 §4) — Web Audio 합성. SFX_FILES[키]에 data URI를 넣으면 파일이 우선 재생 ===== */
const SFX_FILES={};   // 예: SFX_FILES.sizzle="data:audio/mp3;base64,…"  (루프 소리: sizzle·blender·water)
let NOISE=null; function noiseBuf(){ if(NOISE)return NOISE; const c=ac(),n=c.sampleRate; NOISE=c.createBuffer(1,n,c.sampleRate);
  const d=NOISE.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1; return NOISE; }
function playFile(k){ if(!SFX_FILES[k]||SET.vol<=0||!SET.sfx)return false; try{const a=new Audio(SFX_FILES[k]);a.volume=SET.vol;a.play();}catch(_){} return true; }
function noise(dur,filt,freq,vol,delay){ if(SET.vol<=0||!SET.sfx)return; try{ const c=ac(),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=noiseBuf(); s.loop=true; f.type=filt; f.frequency.value=freq; s.connect(f);f.connect(g);g.connect(c.destination);
  const t=c.currentTime+(delay||0),v=(vol||.2)*SET.vol; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.start(t); s.stop(t+dur+.02); }catch(_){} }
const LOOPS={};
const SND={
  good(){ if(playFile("good"))return; beep(523,.12,"sine",.22);beep(784,.18,"sine",.22,.1);},
  pop(){ if(playFile("pop"))return; beep(380,.08,"triangle",.2);},
  chop(){ if(playFile("chop"))return; noise(.05,"highpass",2000,.25); beep(120,.07,"sine",.3,.01); vib(30);},   // 칼 탁
  cut(){ this.chop(); },
  clap(){ if(playFile("clap"))return; [523,659,784,1046].forEach((f,i)=>beep(f,.15,"sine",.2,i*.1));},
  squirt(){ if(playFile("squirt"))return; beep(1500,.05,"square",.16);beep(760,.11,"square",.13,.04); vib(20);},  // 케첩 찍-
  ding(){ if(playFile("ding"))return; beep(1318,.5,"sine",.28);beep(1976,.7,"sine",.18,.06);},                  // 오븐 띵-
  knock(){ if(playFile("knock"))return; beep(400,.04,"sine",.25); noise(.03,"bandpass",1500,.15);},           // 달걀 톡
  crack(){ if(playFile("crack"))return; noise(.09,"lowpass",900,.3); noise(.05,"highpass",2500,.2,.03);},     // 달걀 쩍
  nom(){ if(playFile("nom"))return; beep(300,.06,"triangle",.22); beep(180,.09,"triangle",.2,.05);},          // 냠
  stamp(){ if(playFile("stamp"))return; beep(150,.1,"sine",.35); noise(.05,"lowpass",600,.25); vib(40);},     // 도장 쾅
  twinkle(){ if(playFile("twinkle"))return; [1500,2000,2500].forEach((f,i)=>beep(f,.14,"sine",.16,i*.08));},  // 반짝
  start(kind){ if(LOOPS[kind]||SET.vol<=0||!SET.sfx)return;
    if(SFX_FILES[kind]){ try{const a=new Audio(SFX_FILES[kind]);a.loop=true;a.volume=SET.vol;a.play();LOOPS[kind]={a};}catch(_){} return; }
    try{ const c=ac(),g=c.createGain(); g.gain.value=0; g.connect(c.destination); const nodes=[g];
      if(kind==="sizzle"){ const s=c.createBufferSource(),f=c.createBiquadFilter(),lfo=c.createOscillator(),lg=c.createGain();
        s.buffer=noiseBuf();s.loop=true;f.type="bandpass";f.frequency.value=3000;f.Q.value=.8; lfo.frequency.value=4; lg.gain.value=.08;
        lfo.connect(lg);lg.connect(g.gain); s.connect(f);f.connect(g); s.start();lfo.start(); nodes.push(s,lfo); g.gain.linearRampToValueAtTime(.16*SET.vol,c.currentTime+.15); }
      else if(kind==="blender"){ const o=c.createOscillator(),s=c.createBufferSource(),f=c.createBiquadFilter(),ng=c.createGain(); o.type="sawtooth"; o.frequency.setValueAtTime(90,c.currentTime); o.frequency.linearRampToValueAtTime(130,c.currentTime+.4);
        s.buffer=noiseBuf();s.loop=true;f.type="lowpass";f.frequency.value=800; ng.gain.value=.25; s.connect(f);f.connect(ng);ng.connect(g); o.connect(g); o.start();s.start(); nodes.push(o,s); g.gain.linearRampToValueAtTime(.14*SET.vol,c.currentTime+.1); }
      else { const s=c.createBufferSource(),f=c.createBiquadFilter(),lfo=c.createOscillator(),lg=c.createGain(); s.buffer=noiseBuf();s.loop=true;f.type="lowpass";f.frequency.value=1200;
        lfo.frequency.value=7; lg.gain.value=300; lfo.connect(lg); lg.connect(f.frequency); s.connect(f);f.connect(g); s.start();lfo.start(); nodes.push(s,lfo); g.gain.linearRampToValueAtTime(.12*SET.vol,c.currentTime+.2); }
      LOOPS[kind]={g,nodes}; }catch(_){} },
  stop(kind){ const L=LOOPS[kind]; if(!L)return; delete LOOPS[kind]; if(L.a){try{L.a.pause();}catch(_){} return;}
    try{ const c=ac(); L.g.gain.cancelScheduledValues(c.currentTime); L.g.gain.setTargetAtTime(0,c.currentTime,.08);
      setTimeout(()=>{ L.nodes.forEach(n=>{try{n.stop();}catch(_){} try{n.disconnect();}catch(_){}}); },400); }catch(_){} },
  stopAll(){ Object.keys(LOOPS).forEach(k=>this.stop(k)); }
};

/* 음성 */
let lastSay="";
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)||/ko[-_]KR/i.test(v.lang)||/korean|korea|한국/i.test(v.name));
  if(!vs.length) return null;
  // 자연스러운 음성(Natural/Neural/Online/Google/Siri) 최우선
  const natural=v=>/natural|neural|online|wavenet|google|siri|premium|enhanced/i.test(v.name);
  const fem=/heami|yuna|sora|sun|sunhi|hyemin|jenny|seoyeon|female|여성|선희|혜미/i;
  const mal=/injoon|jihun|gook|hyunsu|male|남성|민준|현수/i;
  const want=SET.voice==="male"?mal:fem;
  const score=v=>(natural(v)?4:0)+(want.test(v.name)?2:0)+(/ko[-_]?KR/i.test(v.lang)?1:0);
  return vs.slice().sort((a,b)=>score(b)-score(a))[0];
}
const SAYS=[];   // 최근 음성 문장(테스트·디버그용)
function say(t){ lastSay=t; SAYS.push(t); if(SAYS.length>30)SAYS.shift(); if(SET.vol<=0||!SET.tts)return; try{ speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang="ko-KR"; u.rate=.97;
  u.pitch = SET.voice==="male"?0.9:1.0; u.volume=Math.min(1,SET.vol+0.1);
  const v=pickVoice(); if(v)u.voice=v;
  speechSynthesis.speak(u);}catch(e){} }
try{speechSynthesis.onvoiceschanged=()=>{};}catch(e){}

/* 화면/안내박스 */
function show(id){SND.stopAll(); if(id!=="s-select"){const hc=document.getElementById("headcust"); if(hc)hc.style.display="none";} document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));}
function curScreen(){const s=document.querySelector(".screen.on");return s?s.id:"";}
/* 을/를 조사 */
function josa(nm,a,b){ const c=(nm||"").charCodeAt((nm||"").length-1); const bat=(c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28)!==0:false; return nm+(bat?a:b); }
function fitText(el){ if(!el)return; el.classList.toggle("longtxt",(el.textContent||"").length>11); }
function setHead(t){const h=document.getElementById("headline"); if(t){h.textContent=t;h.style.display="block";fitText(h);} else h.style.display="none";}
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".speak");if(b&&b.dataset.say)say(b.dataset.say);});

/* 드래그 */
function drag(el, onMove, onUp){
  let id=null,sx=0,sy=0,bx=0,by=0,moved=false;
  el.addEventListener("pointerdown",e=>{
    id=e.pointerId;try{el.setPointerCapture(id);}catch(_){}; sx=e.clientX;sy=e.clientY;moved=false;
    const m=new DOMMatrixReadOnly(getComputedStyle(el).transform);bx=m.m41;by=m.m42;el.style.cursor="grabbing";
  });
  el.addEventListener("pointermove",e=>{ if(e.pointerId!==id)return;
    const x=bx+e.clientX-sx,y=by+e.clientY-sy; if(Math.hypot(x-bx,y-by)>11)moved=true;
    el.style.transform=`translate(${x}px,${y}px)`; onMove&&onMove(x,y,e);
  });
  const end=e=>{ if(e.pointerId!==id)return;id=null;el.style.cursor="grab";onUp&&onUp(e,moved);};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
}
function overlaps(el,t){const a=el.getBoundingClientRect(),b=t.getBoundingClientRect();
  const cx=a.left+a.width/2, cy=a.top+a.height/2; return cx>b.left&&cx<b.right&&cy>b.top&&cy<b.bottom;}
function snapTo(d,t,dy){const tr=t.getBoundingClientRect(),dr=d.getBoundingClientRect();
  const m=new DOMMatrixReadOnly(getComputedStyle(d).transform);  // 현재 드래그 transform에 누적(안 그러면 옆으로 튐)
  const nx=m.m41+(tr.left+tr.width/2-(dr.left+dr.width/2)), ny=m.m42+(tr.top+tr.height/2-(dr.top+dr.height/2))+(dy||0);
  d.style.transition="transform .25s"; d.style.transform=`translate(${nx}px,${ny}px)`;}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1100);}
/* 손 연출(공용) — 도구 쥔 손(✊)/재료 잡는 손(✋). 그림(handGrip/handHold) 넣으면 자동 교체 */
/* 손 크기는 토큰 --sz-hand 하나로 고정(설계 §1-4). 두 번째 인자는 하위 호환용으로 무시 */
function handWrap(inner){ return `<span data-hand style="display:inline-block;line-height:0;">${inner}</span>`; }
function gripHand(deg,_sz,flip){ const s="var(--sz-hand)", t=`rotate(${deg||0}deg)${flip?" scaleX(-1)":""}`;
  return handWrap(IMG.handGrip?`<img src="${IMG.handGrip}" style="width:${s};transform:${t};display:block;">`
    :`<span style="font-size:${s};line-height:1;display:inline-block;transform:${t};">✊</span>`); }
function holdHand(deg,_sz,flip){ const s="var(--sz-hand)", t=`rotate(${deg||0}deg)${flip?" scaleX(-1)":""}`;
  return handWrap(IMG.handHold?`<img src="${IMG.handHold}" style="width:${s};transform:${t};display:block;">`
    :`<span style="font-size:${s};line-height:1;display:inline-block;transform:${t};">✋</span>`); }
/* 칼 쥔 손 — 손등이 보이는 전용 그림(handGripBack) 우선, 없으면 쥔 손 */
function knifeHand(deg,_sz){ const s="var(--sz-hand)";
  if(IMG.handGripBack) return handWrap(`<img src="${IMG.handGripBack}" style="width:${s};transform:rotate(${deg||0}deg);display:block;">`);
  return gripHand(deg); }

/* ===== 프로필 (설계 §2) — 학생별 이름·사진·수준·도장·별. localStorage cookrun_profiles / cookrun_cur ===== */
const PROF={
  _k:"cookrun_profiles", _c:"cookrun_cur",
  list(){ try{return JSON.parse(localStorage.getItem(this._k)||"[]");}catch(_){return [];} },
  save(arr){ try{localStorage.setItem(this._k,JSON.stringify(arr));}catch(_){ say("저장 공간이 가득 찼어요."); } },
  cur(){ const id=localStorage.getItem(this._c); return this.list().find(p=>p.id===id)||null; },
  select(id){ try{localStorage.setItem(this._c,id);}catch(_){} },
  add(o){ const arr=this.list(); if(arr.filter(p=>p.id!=="anon").length>=12)return null;
    const p={id:"p"+Date.now()+Math.floor(Math.random()*1000),name:o.name,photo:o.photo||null,level:o.level||"나",stamps:{},stars:0,master:false,created:Date.now()};
    arr.push(p); this.save(arr); return p; },
  update(p){ const arr=this.list(); const i=arr.findIndex(x=>x.id===p.id); if(i<0)arr.push(p); else arr[i]=p; this.save(arr); },
  remove(id){ this.save(this.list().filter(p=>p.id!==id)); if(localStorage.getItem(this._c)===id)localStorage.removeItem(this._c); },
  ensure(){ let p=this.cur(); if(p)return p; const arr=this.list(); p=arr.find(x=>x.id==="anon");
    if(!p){ p={id:"anon",name:"요리사",photo:null,level:"나",stamps:{},stars:0,master:false,created:Date.now()}; arr.push(p); this.save(arr); }
    this.select("anon"); return p; },
  addStamp(dishId){ const p=this.ensure(); const c=(p.stamps[dishId]||0)+1; p.stamps[dishId]=c; this.update(p); return {first:c===1,count:c}; },
  addStar(){ const p=this.ensure(); p.stars=(p.stars||0)+1; this.update(p); return p.stars; },
  face(p,sz){ sz=sz||"var(--sz-hand)"; if(p&&p.photo)return `<img src="${p.photo}" style="width:${sz};height:${sz};object-fit:cover;border-radius:50%;display:block;">`;

/* 문장 → 액션 자동 매칭(앞에 있는 규칙 우선) */
const ACT_MATCH=[[/꽂|꼬치/,"skewer"],[/달걀|깨/,"crack"],[/씻/,"wash"],[/오븐/,"oven"],[/(썰|자르|잘라)/,"cut"],[/(저어|젓|섞)/,"stir"],[/(부어|붓|따라|따르)/,"pour"],
  [/짜/,"squeeze"],[/(뿌리|뿌려)/,"shake"],[/흔들/,"shake"],[/(떠서|떠요|뜨)/,"scoop"],[/(뭉치|뭉쳐|주먹)/,"knead"],
  [/(구워|굽)/,"bake"],[/뒤집/,"flip"],[/(껍질|까요|까서)/,"peel"],[/(발라|바르)/,"rub"],[/(올려|올리|담아|담)/,"fill"]];
function matchAct(t){ for(const p of ACT_MATCH) if(p[0].test(t)) return p[1]; return null; }
/* 사진 첨부 → 축소 dataURL(localStorage 용량 보호) */
function fileToData(file, maxd, cb){ const rd=new FileReader();
  rd.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,maxd/Math.max(im.width,im.height));
      const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(im.width*s)); c.height=Math.max(1,Math.round(im.height*s));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL(file.type==="image/png"?"image/png":"image/jpeg",.85)); }; im.src=rd.result; };
  rd.readAsDataURL(file); }
/* 그림 생성 프롬프트(필요이미지_생성프롬프트.md 규칙과 동일 스타일) */
function imgPrompt(nm){ return "순백색 배경(#ffffff)에 "+nm+" 하나만 화면 정중앙에 크게 그려 주세요. 납작한 2D 어린이 그림책 일러스트, 부드러운 진갈색 외곽선, 잔잔한 셀 셰이딩, 따뜻하고 귀여운 톤. 바닥 그림자·반사·글자·워터마크·손 없음."; }
function makeCustomDish(c,idx){
  const d={id:"custom"+idx,nm:c.nm,e:c.e||"🍽️",ready:true,custom:true,img:c.img||null,scale:c.scale||1};
  d.need=(c.need||[]).map((n,j)=>{ if(typeof n==="string") return n;   // 목록 재료는 키, 직접 추가 재료는 PANTRY에 임시 등록
    const key="cust"+idx+"_"+j;
    PANTRY[key]={nm:n.nm,e:n.e||"🥘",custom:true};
    if(n.img){ IMG[key]=n.img; PANTRY[key].img=key; }
    return key; });
  d.sizes={}; d.need.forEach((k,j)=>{ const m=c.sizes&&c.sizes[j]; if(m&&m!==1)d.sizes[k]=m; });   // 재료별 크기(저장은 need 순번, 적용은 키)
  const acts=(c.acts||[]).map(a=>typeof a==="string"?{a:a}:a).filter(a=>a.a==="show"||CUSTOM_ACTS[a.a]);
  d.steps=acts.map((a,j)=>{
    if(a.a==="show") return {id:j+1,label:"따라하기",text:a.text||"선생님을 보고 따라해요",say:a.text||"선생님을 보고 따라해요",praise:"잘했어요",
      build:w=>buildShow(w,a.img,a.text),card:()=>a.img?`<img src="${a.img}" class="gimg" style="border-radius:1.5vmin;">`:`<div class="cardemoji">🧑‍🍳</div>`};
    const A=CUSTOM_ACTS[a.a];
    return {id:j+1,label:A.nm,text:a.text||A.text,say:a.text||A.say,praise:"잘했어요",build:A.mk(d),card:()=>`<div class="cardemoji">${A.ic}</div>`}; });
  const foodHTML=()=> d.img?`<img src="${d.img}" style="width:100%;height:100%;object-fit:contain;border-radius:2vmin;">`:`<div class="cardemoji" style="font-size:16vmin;">${d.e}</div>`;
  addServeStep(d.steps, foodHTML, [], d.e); addGiveStep(d.steps);
  d.done=()=> d.img?`<img src="${d.img}" style="max-width:100%;max-height:56vmin;display:block;margin:0 auto;border-radius:2.4vmin;">`:`<div class="cardemoji" style="font-size:clamp(120px,30vmin,320px);">${d.e}</div>`;
  return d;
}
function loadCustomDishes(){
  Object.keys(PANTRY).forEach(k=>{ if(PANTRY[k].custom){ delete PANTRY[k]; delete IMG[k]; } });   // 임시 재료 재등록
  for(let i=DISHES.length-1;i>=0;i--) if(DISHES[i].custom) DISHES.splice(i,1);
  customLoad().forEach((c,i)=>DISHES.push(makeCustomDish(c,i)));
}
loadCustomDishes();

function edPreview(){
  const pv=document.getElementById("ed-pv"); if(!pv)return;
  const temp=makeCustomDish({nm:ED.nm||"미리보기",e:ED.e,img:ED.img,need:ED.need,acts:ED.acts,scale:1,sizes:ED.sizes},999);
  currentDish=temp;   // fsz()가 재료별 크기를 읽도록
  const steps=temp.steps;
  const chips=document.getElementById("ed-pvsteps");
  if(chips)chips.innerHTML=steps.map((s,i)=>`<div class="edchip ${i===PVIDX?'sel':''}" data-pv="${i}">${s.label}</div>`).join("");
  if(chips)chips.querySelectorAll("[data-pv]").forEach(el=>el.onclick=()=>{PVIDX=+el.dataset.pv;SND.pop();edPreview();});
  PVIDX=Math.min(PVIDX,steps.length-1);
  chosen=temp.need.slice();   // 빌더들이 재료를 읽도록
  pv.innerHTML=`<div id="ed-pvin" style="position:absolute;inset:0;transform:scale(${ED.scale});transform-origin:50% 30%;"></div>`;
  try{ steps[PVIDX].build(pv.firstElementChild); }catch(e){ pv.innerHTML=`<div style="padding:3vmin;">미리보기 오류: ${e.message}</div>`; }
}

function succeed(){ if(curScreen()==="s-edit"){ SND.good(); toast("좋아요!"); return; }   // 편집기 미리보기에선 단계 진행 안 함
  SND.good(); const s=STEPS[stepIdx]; toast(s.praise+"!"); say(s.praise);
  const wait=Math.max(1200, COOK_MIN_MS-(Date.now()-cookT0)); setTimeout(nextStep,wait); }
function renderStep(){
  if(LV().choose&&stepIdx>0&&!CHOSEN_OK[stepIdx]&&curScreen()!=="s-edit"){ renderChoose(); return; }   // '다' 수준: 다음 단계 고르기
  washPhase="before"; show("s-step"); setHead(null); band(); applyHint(); ghostClear();
  cookT0=Date.now(); SND.stopAll();   // 단계 시작 시각(최소 3초 보장용)
  const s=STEPS[stepIdx];
  document.getElementById("g-text").textContent=s.text; fitText(document.getElementById("g-text"));
  document.getElementById("g-say").onclick=()=>say(s.say);
  say(s.say);
  const w=document.getElementById("work"); w.innerHTML="";
  // 교사 설정 크기(커스텀 요리): 무대 전체 확대/축소
  const sc=(currentDish&&currentDish.scale&&currentDish.scale!==1)?currentDish.scale:null;
  w.style.transform=sc?`scale(${sc})`:""; w.style.transformOrigin="50% 38%";
  STEPS[stepIdx].build(w);
  ghost(w, ghostTypeOf(w));   // 8초 무입력이면 유령 손 시범(가·나 수준)
}
function wholeSandwich(){ return `<img class="base" src="${IMG.hero}">`; }

/* 1) 빵 두 장 나란히 접시에 */
function buildBread(w){
  w.innerHTML=sceneTable(`<div class="plate-stage"><img class="plate" src="${IMG.plate}">
      <div id="dropb" class="target-out hintglow" style="left:14%;right:14%;top:26%;height:42%;border-radius:50%;"></div>
      <div class="sand" id="onplate"></div>
    </div>`);
  const tray=w.querySelector("#tray"), onp=w.querySelector("#onplate");
  const d=document.createElement("div");d.className="drag tray-item";d.style.position="relative";
  d.style.width="calc(var(--sz-ing)*1.3)";

  drag(d,null,()=>{ const t=w.querySelector("#dropb");

/* 2) 잼 3단계 — ①숟가락을 병에 대면 뚜껑 열림 ②병 속에 담그면 잼 뜬 숟가락 ③빵 위에서 좌우 10회 문지르면 잼 발림 */
function buildSpread(w){
  const jar=IMG.jamJar, CUT=40;   // CUT=뚜껑/몸통 경계(%): 체크천 아래·유리 입구 위
  const SPOON_DEG=180, JAMSPOON_DEG=0;   // 숟가락 각도(도) — 여기서 조절
  w.innerHTML=`<div class="cookrow">
    <div id="jarbox" style="position:relative;width:calc(var(--sz-ing)*1.4);text-align:center;">
      <div style="position:relative;">
      ${jar?`<img id="jarClosed" src="${jar}" style="width:100%;display:block;clip-path:inset(${CUT-0.5}% 0 0 0);transition:opacity .4s;">
             ${IMG.jamJarOpen?`<img id="jarOpen" src="${IMG.jamJarOpen}" style="position:absolute;left:0;bottom:0;width:100%;opacity:0;transition:opacity .4s;">`:""}
             <img id="lid" src="${jar}" style="width:100%;display:block;clip-path:inset(0 0 ${100-CUT}% 0);position:absolute;left:0;top:0;transition:transform .5s,opacity .5s;z-index:3;">`
           :`<div class="cardemoji" style="font-size:20vmin;">🫙</div>`}
      </div><div class="nm">딸기잼</div>
    </div>
    <div class="plate-stage"><img class="plate" src="${IMG.plate}">
      <div class="sand"><img class="base" src="${IMG.breadBot}">
        <img id="jam" src="${IMG.jamSpread||IMG.jam}" style="position:absolute;left:17%;width:66%;top:48%;transform:translateY(-50%);opacity:0;pointer-events:none;">
      </div>
    </div>
  </div>
  <div class="drag hintglow toolstart" id="spoon" style="width:calc(var(--sz-tool)*.45);">
    <div id="spimg">${IMG.spoon?`<img src="${IMG.spoon}" style="width:100%;transform:rotate(${SPOON_DEG}deg);display:block;">`:`<div style="font-size:9vmin;">🥄</div>`}</div>
  </div>`;
  const spoon=w.querySelector("#spoon"), spimg=w.querySelector("#spimg"), lid=w.querySelector("#lid"),
        jamOv=w.querySelector("#jam"), jarEl=w.querySelector("#jarbox"), breadEl=w.querySelector(".sand");
  let phase=0,cnt=0,dir=0,lx=null,done=false; const need=N(10);   // phase 0=닫힘 1=열림 2=잼 뜸
  const inside=(el,x,y)=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;};
  drag(spoon,(tx,ty,e)=>{ if(done||!e)return;
    const x=e.clientX, y=e.clientY;   // 판정은 반드시 클라이언트 좌표(드래그 tx/ty는 translate 오프셋)
    if(phase===0){ if(inside(jarEl,x,y)){ phase=1; SND.pop();
      if(lid){lid.style.transform="translate(-60%,-70%) rotate(-24deg)";lid.style.opacity=0;}
      const jc=w.querySelector("#jarClosed"), jo=w.querySelector("#jarOpen");
      if(jo){ jc.style.opacity=0; jo.style.opacity=1; }
      say("뚜껑이 열렸어요. 숟가락으로 잼을 떠요."); } }
    else if(phase===1){ const r=jarEl.getBoundingClientRect();   // 병 아래쪽(잼 속)에 담가야 떠짐
      if(x>=r.left&&x<=r.right&&y>=r.top+r.height*.45&&y<=r.bottom){ phase=2; SND.pop();
        spimg.innerHTML=IMG.jamSpoon?`<img src="${IMG.jamSpoon}" style="width:230%;margin-left:-65%;transform:rotate(${JAMSPOON_DEG}deg);display:block;">`:`<div style="font-size:9vmin;">🥄🍓</div>`;   // 나무숟가락과 비슷한 체감 크기(그림 비율 차 보정)
        say("잼을 떴어요. 빵 위에서 좌우로 열 번 발라요."); } }
    else if(phase===2){ if(!inside(breadEl,x,y)){ lx=null; return; }
      if(lx==null){ lx=x; return; }
      const dx=x-lx;
      if(Math.abs(dx)>14){ lx=x; const nd=Math.sign(dx);   // 좌우 방향이 바뀔 때마다 1회
        if(nd!==dir){ dir=nd; cnt++; SND.pop(); jamOv.style.opacity=Math.min(1,cnt/need);
          if(cnt>=need){ done=true; SND.good(); spoon.style.transition="opacity .4s"; spoon.style.opacity=0; succeed(); } } } }
  }, ()=>{ lx=null; });
}

/* 재료 레이어 — 재료별 자연 비율, 빵의 ~90%를 덮도록(삐져나오지 않게) */
const LYRS={ham:{w:92,h:58},cheese:{w:90,h:60},lettuce:{w:94,h:56}};
function lyrHTML(k,j,cls){ const L=LYRS[k]||{w:90,h:56};

/* 4) 올리기 — 접시 위 빵, 사이드 패널에서 재료 드래그 */
function buildStack(w){
  const placed=[], queue=chosen.slice();
  function render(){
    const layers=placed.map((k,j)=>lyrHTML(k,j,"land")).join("");
    w.innerHTML=sceneTable(`<div class="plate-stage"><img class="plate" src="${IMG.plate}">
        <div class="sand" id="sand"><img class="base" src="${IMG.breadBot}">${layers}

      </div>`);
    if(queue.length===0){ const di=document.getElementById("dropi"); if(di)di.remove(); setTimeout(succeed,500); return; }
    const tray=w.querySelector("#tray");
    queue.forEach(k=>{
      const d=document.createElement("div");d.className="drag tray-item";d.style.position="relative";
      d.style.width=`calc(var(--sz-ing)*${ING_SZ[k]||1})`;

        else { d.style.transition="transform .2s";d.style.transform="";setTimeout(()=>d.style.transition="",200); } });
    });
  }
  render();
}

/* 6) 자르기 — 칼 전체(손잡이 포함) 위에서 아래로 */
function buildCut(w){
  w.innerHTML=`<div class="plate-stage" id="board">
    <div id="whole" style="position:relative;width:100%;"><img src="${IMG.hero}" style="width:100%;display:block;"></div>
    <div id="hold" style="position:absolute;left:5%;top:46%;z-index:6;transition:transform .1s;">${holdHand(0,"12vmin")}</div>
    ${PICK.shape==="rect"?`<div id="dash" style="position:absolute;left:50%;top:-4%;bottom:-4%;border-left:.9vmin dashed #fff;transform:translateX(-50%);filter:drop-shadow(0 0 .5vmin rgba(0,0,0,.55));"></div>`
      :`<div id="dash" style="position:absolute;left:-6%;right:-6%;top:50%;height:0;border-top:.9vmin dashed #fff;transform:rotate(-38deg);transform-origin:50% 50%;filter:drop-shadow(0 0 .5vmin rgba(0,0,0,.55));"></div>`}
    <div class="drag" id="knife" style="left:50%;transform:translateX(-50%);top:-8%;z-index:8;"><div style="position:relative;"><img src="${IMG.knife}" style="height:var(--sz-knife);width:auto;"><div style="position:absolute;left:50%;bottom:8%;transform:translateX(-50%);z-index:2;">${knifeHand(-8,"9vmin")}</div></div></div>
  </div>`;
  const knife=w.querySelector("#knife"),hd=w.querySelector("#hold");let dist=0,done=false,ly=null;
  drag(knife,(x,y)=>{ if(done)return; if(ly!==null){const dy=y-ly; if(dy>0)dist+=dy;} ly=y;  // 내리써는 동작만 인정
    if(dist>110){done=true;SND.cut();
      const st=w.querySelector("#board"); const fx=document.createElement("div"); fx.className="cutflash"; fx.style.left="50%"; st.appendChild(fx);
      requestAnimationFrame(()=>fx.style.opacity=0); setTimeout(()=>fx.remove(),380);
      hd.classList.remove("squish"); void hd.offsetWidth; hd.classList.add("squish");
      splitAnim(w);setTimeout(succeed,600);} }, ()=>{ ly=null; });
}
function splitAnim(w){
  w.querySelector("#dash").style.display="none";
  const knife=w.querySelector("#knife"); if(knife){knife.style.transition="opacity .3s";knife.style.opacity=0;}
  w.querySelector("#whole").innerHTML=(IMG.heroCut&&PICK.shape!=="rect")?`<img class="land" src="${IMG.heroCut}" style="width:100%;display:block;">`   // 잘린 샌드위치 그림(세모). 네모면 세로 반 분할
   :`<div style="display:flex;gap:6%;justify-content:center;">
    <div style="width:47%;overflow:hidden;"><img src="${IMG.hero}" style="width:213%;display:block;"></div>
    <div style="width:47%;overflow:hidden;display:flex;justify-content:flex-end;"><img src="${IMG.hero}" style="width:213%;display:block;"></div></div>`;
}

/* ===== 과일 샐러드·주스 (이미지) ===== */
/* 과일 1개(이미지 또는 이모지) */
function fcImg(k,sz){ sz=sz||"11vmin"; return IMG[k]?`<img src="${IMG[k]}" style="width:${sz};height:${sz};object-fit:contain;">`:`<span style="font-size:${sz};line-height:1;">${(FRUITS[k]||PANTRY[k]||{e:"🍓"}).e}</span>`; }
/* 실제 크기 비율표 — 모든 재료(설계 §1-2). --sz-ing 또는 fsz() 기준값에 곱한다 */
const ING_SZ={watermelon:1.7,pineapple:1.6,melon:1.55,banana:1.25,mango:1.15,apple:1.1,orange:1.05,peach:1.05,tomato:1.05,
  kiwi:.85,egg:.85,strawberry:.8,grape:.65,blueberry:.55,bread:1.3,hotdogbun:1.3,milk:1.2,flour:1.2,yogurt2:1.2,
  lettuce:1.15,ham:1,cheese:1,jam:.9,sausage:.9,carrot:.9,rice:1,fish:1,butter:.9};
const FRUIT_SZ=ING_SZ;   // 하위 호환
function fsz(k,base){ const m=(currentDish&&currentDish.sizes&&currentDish.sizes[k])||1;   // 교사 설정 재료별 크기 배수
  return (Math.max(7, base*(FRUIT_SZ[k]||1))*m).toFixed(1)+"vmin"; }  // 최소 7vmin — 작은 과일이 너무 작아지지 않게
/* 흰 덩이(밥 한 술·요거트 한 스푼) — 그림(riceLump/yogurtBlob) 넣으면 자동 교체 */
function lumpHTML(kind){ const key=kind==="yogurt"?"yogurtBlob":"riceLump";
  if(IMG[key]) return `<img src="${IMG[key]}" style="width:5.5vmin;height:4.5vmin;object-fit:contain;">`;
  return `<div style="width:5.2vmin;height:3.8vmin;border-radius:50% 50% 46% 46%;background:#fff;border:.3vmin solid #e6e0d4;box-shadow:inset 0 -.7vmin 0 rgba(0,0,0,.05);"></div>`; }
/* 고른 과일 묶음 — 과일별 실제 크기 반영 */
function fruitCluster(sz){ const base=parseFloat(sz)||12; const ks=chosen.length?chosen:["strawberry","banana"]; return `<div style="display:flex;flex-wrap:wrap;gap:.6vmin;align-items:center;justify-content:center;">`+ks.map(k=>fcImg(k,fsz(k,base))).join("")+`</div>`; }
/* 도구(이미지 또는 이모지) */
function jimg(k,emoji,sz){ return IMG[k]?`<img src="${IMG[k]}" style="width:${sz||'100%'};${sz?'':'display:block;'}object-fit:contain;">`:`<div class="cardemoji" style="font-size:clamp(130px,32vmin,340px)">${emoji}</div>`; }
function saladBowlHTML(){ return `<div style="position:relative;width:100%;">${jimg("saladPlate","🥣")}<div style="position:absolute;left:10%;right:10%;top:8%;height:56%;display:flex;flex-wrap:wrap;gap:.4vmin;align-items:center;justify-content:center;">${(chosen.length?chosen:["strawberry","banana"]).slice(0,6).map(k=>fcImg(k,fsz(k,8))).join("")}</div></div>`; }
function buildSaladFill(w){
  const placed=[],queue=chosen.slice();
  function render(){
    w.innerHTML=sceneTable(`<div class="plate-stage">
      ${jimg("saladPlate","🥣")}

    </div>`);
    const laid=w.querySelector("#laid");
    placed.forEach(k=>{ laid.insertAdjacentHTML("beforeend",fcImg(k,fsz(k,10))); });   // 담으면 오히려 크게(실제 과일 크기 반영)
    if(!queue.length){ const di=w.querySelector("#dropi"); if(di)di.remove(); setTimeout(succeed,500); return; }
    const tray=w.querySelector("#tray");

      d.innerHTML=fcImg(k,fsz(k,9));

function rubMix(w, baseHTML, overlayHTML, hint){
  w.innerHTML=`<div class="plate-stage">
    <div style="position:relative;width:100%;text-align:center;">${baseHTML}
      <div id="ov" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;">${overlayHTML}</div>
    </div>
    <div id="rubhand" style="position:absolute;left:50%;top:36%;z-index:6;pointer-events:none;transition:left .06s,top .06s;">${holdHand(0,"9vmin")}</div>
    <div id="rub" style="position:absolute;inset:0;cursor:grab;"></div>
    <div class="bubblehint" style="top:-8vmin;">${hint||"👆↔️ 문질러요"}</div>
  </div>`;
  const rub=w.querySelector("#rub"),ov=w.querySelector("#ov"),hand=w.querySelector("#rubhand");
  let dist=0,last=null,down=false,done=false;const need=Math.round(800*LV().k);
  rub.addEventListener("pointerdown",e=>{down=true;last=e.clientX;try{rub.setPointerCapture(e.pointerId);}catch(_){}});
  rub.addEventListener("pointermove",e=>{ if(!down||done)return; dist+=Math.abs(e.clientX-last);last=e.clientX;
    const r=rub.getBoundingClientRect();   // 손이 문지르는 위치를 따라감
    hand.style.left=Math.max(8,Math.min(92,(e.clientX-r.left)/r.width*100))+"%";
    hand.style.top=Math.max(6,Math.min(80,(e.clientY-r.top)/r.height*100))+"%";
    ov.style.opacity=Math.min(1,dist/need); if(dist>=need){done=true;succeed();} });
  const up=()=>down=false;rub.addEventListener("pointerup",up);rub.addEventListener("pointercancel",up);
}
function buildSaladPour(w){ buildScoop(w,{srcImg:"yogurt",srcEmoji:"🥛",srcName:"요거트",blobHTML:lumpHTML("yogurt"),toHTML:saladBowlHTML(),scoops:3,hint:"🥄 요거트를 떠서 과일 위에 뿌려요"}); }
function buildSaladMix(w){ buildStir(w, saladBowlHTML(), "spoon", null, false, 45); }  // 숟가락 손잡이를 쥐고 45도 기울여 젓기
/* 고른 과일의 '썬 모습' 묶음(없으면 통과일) */
function slicedCluster(sz){ const base=parseFloat(sz)||12; const ks=chosen.length?chosen:["strawberry","banana"];   // fruitCluster처럼 숫자+실제크기(fsz) 지원
  return `<div style="display:flex;flex-wrap:wrap;gap:.6vmin;align-items:center;justify-content:center;">`+ks.map(k=>{const s=fsz(k,base); return IMG[k+"_s"]?`<img src="${IMG[k+"_s"]}" style="width:${s};height:${s};object-fit:contain;">`:fcImg(k,s);}).join("")+`</div>`; }

/* 수도꼭지 돌리기 — stage 안 (x%,y%)에 손잡이를 놓고, 손잡이를 중심으로 1바퀴 돌리면 onDone (설계 §9-2) */
function knobTurn(stage,opts,onDone){ opts=opts||{}; document.querySelectorAll("#knob").forEach(k=>k.remove());   // 다른 화면에 남은 손잡이 제거
  const k=document.createElement("div"); k.id="knob"; k.className="knob hintglow"; k.style.cssText=`left:${opts.x||50}%;top:${opts.y||10}%;`;
  k.innerHTML=`<div class="knobdisc"></div>${holdHand(0)}`; stage.appendChild(k);
  let down=false,last=null,total=0,done=false; const disc=k.querySelector(".knobdisc");
  const ctr=()=>{const r=k.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};};
  const finish=()=>{ if(done)return; done=true; k.classList.add("on"); k.classList.remove("hintglow"); SND.pop(); SND.start("water"); onDone&&onDone(); };
  k.addEventListener("pointerdown",e=>{ e.stopPropagation(); if(done)return; down=true; const c=ctr(); last=Math.atan2(e.clientY-c.y,e.clientX-c.x); try{k.setPointerCapture(e.pointerId);}catch(_){} });
  k.addEventListener("pointermove",e=>{ if(!down||done)return; e.stopPropagation(); const c=ctr(); const a=Math.atan2(e.clientY-c.y,e.clientX-c.x); let d=a-last; if(d>Math.PI)d-=2*Math.PI; if(d<-Math.PI)d+=2*Math.PI; last=a; total+=d;
    disc.style.transform=`rotate(${total}rad)`; if(Math.abs(total)>=Math.PI*2) finish(); });
  const up=e=>{ e.stopPropagation(); down=false; }; k.addEventListener("pointerup",up); k.addEventListener("pointercancel",up);
  window.__T.skipKnob=finish;   // 테스트·교사용 건너뛰기
  return k; }

    else if(phase===2){ phase=3; door.style.transform="";

      btnMin.classList.add("hintglow"); btnSec.classList.add("hintglow"); } });

  function tick(){ if(done)return; if(p===0)steam(stage,6000); p+=3/LV().k; glow.style.opacity=Math.min(.9,p/100);
    doorwin.style.background=`rgba(255,${170-p},40,${.25+p*0.004})`; beep(180+p*3,.04,"sawtooth",.06);

/* 장바구니 */
function ingIcon(k){const p=PANTRY[k]; const mw=Math.min(94,Math.round(70*(ING_SZ[k]||1))); return p.img&&IMG[p.img]?`<div class="picwrap"><img src="${IMG[p.img]}" style="max-width:${mw}%;max-height:${mw}%;"></div>`:`<div class="picwrap"><div class="em">${p.e}</div></div>`;}
function openCart(dish){
  STEPS=dish.steps||SANDWICH_STEPS;
  const free=!!dish.freeChoice;
  show("s-cart"); setHead(free?"원하는 과일을 골라요":(dish.nm+" 재료를 골라요"));
  document.getElementById("cart-say").onclick=()=>say("필요한 재료를 골라 봅시다.");
  buildCart(dish);
  say("필요한 재료를 골라 봅시다.");

function buildCart(dish){
  const free=!!dish.freeChoice;
  const need=dish.need.slice();
  // 상단 레시피 카드(계속 표시)
  const strip=document.getElementById("recipe-strip");
  if(free){ strip.innerHTML=`<span class="rlabel">원하는 과일을 골라요</span>`; }
  else { strip.innerHTML=`<span class="rlabel">필요한 재료</span>`+need.map(k=>{const p=PANTRY[k];
    const ic=p.img&&IMG[p.img]?`<img src="${IMG[p.img]}">`:`<span class="rem">${p.e}</span>`;
    return `<span class="rchip">${ic}${p.nm}</span>`;}).join(""); }
  // 카드 6×2
  let items;
  if(free){ items=need.slice(0,12); }
  else { // 필요한 재료(전부) + 방해자극으로 12칸 채우고 위치만 섞기 → 필요 재료 항상 포함
    const distract=Object.keys(PANTRY).filter(k=>!need.includes(k)&&!PANTRY[k].custom).sort(()=>Math.random()-.5).slice(0,Math.max(0,12-need.length));   // 교사 추가 재료는 다른 요리 방해자극에서 제외
    items=need.concat(distract).sort(()=>Math.random()-.5); }
  const grid=document.getElementById("grid12"); grid.innerHTML="";
  const got=new Set(), collected=[];
  const cd=document.getElementById("cart-done");
  cd.style.display=free?"":"none"; cd.classList.remove("hintglow");
  if(free){cd.disabled=true;cd.style.opacity=.4;cd.onclick=()=>{ if(collected.length<(dish.minPick||1)){ say(dish.minPick>1?"두 가지 이상 골라요.":"재료를 골라요."); return; } finish(); };}
  function finish(){ chosen=(currentDish&&currentDish.custom)?collected.slice():collected.filter(k=>ING[k]||FRUITS[k]); SND.clap();   // 커스텀 요리는 고른 재료 전부 사용
    document.getElementById("cookpop").classList.add("on"); say("다 골랐어요! 요리 시작 단추를 눌러요."); }
  function select(k,el,p){ got.add(k);collected.push(k);el.classList.add("sel");SND.pop();say(p.nm);   // 카드가 튀어나옴
    if(k===gold&&el.classList.contains("gold")){ el.classList.remove("gold"); SND.twinkle(); PROF.addStar(); setTimeout(()=>say("황금 "+p.nm+"예요! 별을 받았어요."),400); }
    if(free){ cd.disabled=false; cd.style.opacity=1; cd.classList.add("hintglow");
      if(collected.length===1) say("한 개만 골라도 돼요. 다 골랐으면 다 담았어요 단추를 눌러요."); }
    else if(got.size===need.length){ setTimeout(finish,400); } }
  function deselect(k,el){ got.delete(k); const i=collected.indexOf(k); if(i>-1)collected.splice(i,1); el.classList.remove("sel");
    if(free&&!collected.length){ cd.disabled=true;cd.style.opacity=.4;cd.classList.remove("hintglow"); } }
  function reject(el){ el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");beep(200,.12,"sine",.18);say("이건 필요 없어요."); }
  const gold=goldPick(items,need,free);   // 25% 확률 황금 재료(별 하나)
  items.forEach(k=>{const p=PANTRY[k];const el=document.createElement("div");el.className="pantry"+(k===gold?" gold":"");
    el.innerHTML=ingIcon(k)+`<div class="pn">${p.nm}</div>`;
    el.onclick=()=>{ if(got.has(k)){ deselect(k,el); return; }
      if(free||need.includes(k)) select(k,el,p); else reject(el); };
    grid.appendChild(el);
  });
}
