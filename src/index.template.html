  } else {
    sink.style.background=""; if(IMG.washimg)wi.src=IMG.washimg; wi.style.transition="transform .12s";
  }
  const wneed=N(10); foam.style.height="0"; cnt.textContent="0 / "+wneed;
  let count=0,dir=0,lastX=null,dn=false,ok=false,ready=false;
  const amt=useSep?5:2.4, rot=useSep?6:3;
  knobTurn(sink,{x:50,y:6},()=>{ ready=true; if(useSep&&IMG.basinWater) sink.style.backgroundImage="url("+IMG.basinWater+")"; say("물이 나와요. 손을 좌우로 문질러요."); });
  sink.onpointerdown=e=>{ if(!ready){ say("먼저 수도꼭지를 돌려요."); return; } dn=true;lastX=e.clientX;try{sink.setPointerCapture(e.pointerId);}catch(_){} SND.start("water"); };
  sink.onpointermove=e=>{ if(!dn||ok)return; const dx=e.clientX-lastX;
    if(Math.abs(dx)>6){ const nd=Math.sign(dx);
      wi.style.transform=baseT+" translateX("+(nd*amt)+"vmin) rotate("+(nd*rot)+"deg)"; bubble(sink);  // 손만 좌우로 비비기+거품
      if(nd!==0&&nd!==dir){ dir=nd; count++; cnt.textContent=count+" / "+wneed; SND.pop(); splash(sink);  // 물방울 튀기기
        if(!useSep) foam.style.height=Math.min(100,count/wneed*100)+"%";
        if(count>=wneed){ ok=true; wi.style.transform=baseT;
          if(phase==="after"){ SND.good(); say("손이 깨끗해요! 다 했어요."); setTimeout(finishCooking,800); }
          else { SND.good(); say("깨끗해요! 이제 만들어요."); stepIdx=0; setTimeout(renderStep,800); } } }
      lastX=e.clientX; } };
  sink.onpointerup=()=>{dn=false;wi.style.transform=baseT;SND.stop("water");}; sink.onpointercancel=()=>{dn=false;wi.style.transform=baseT;SND.stop("water");};
}
function bubble(sink){ const b=document.createElement("div"); b.className="bubble";
  b.style.left=(20+Math.random()*60)+"%"; b.style.bottom=(18+Math.random()*28)+"%"; sink.appendChild(b);
  requestAnimationFrame(()=>{ b.style.transform="translateY(-14vmin)"; b.style.opacity="0"; });
  setTimeout(()=>b.remove(),700); }
/* 제스처 재미 요소: 반짝임 버스트 + 진행 점(공용) */
function sparkle(stage,x,y){ if(!stage)return; const em=["✨","💫","⭐","🫧"];
  for(let i=0;i<4;i++){ const s=document.createElement("div"); s.className="sparkle"; s.textContent=em[i%em.length];
    s.style.left=((x!=null?x:50)+(Math.random()*30-15))+"%"; s.style.top=((y!=null?y:44)+(Math.random()*20-10))+"%";
    stage.appendChild(s);
    requestAnimationFrame(()=>{ s.style.transform="translateY(-8vmin) scale(1.4)"; s.style.opacity="0"; });
    setTimeout(()=>s.remove(),640); } }
function pipbar(w,total){ const bar=document.createElement("div"); bar.className="pipbar";
  for(let i=0;i<total;i++){ const p=document.createElement("div"); p.className="pip"; bar.appendChild(p); }
  const stage=w.querySelector(".plate-stage,.pov")||w; stage.appendChild(bar);
  return { tick(n){ [...bar.children].forEach((p,i)=>p.classList.toggle("on",i<n)); } }; }
function splash(host){ for(let i=0;i<3;i++){ const d=document.createElement("div"); d.className="drop";
  d.style.left=(40+Math.random()*20)+"%"; d.style.top=(52+Math.random()*14)+"%"; host.appendChild(d);
  const dx=(Math.random()*2-1)*11, dy=-(7+Math.random()*9);
  requestAnimationFrame(()=>{ d.style.transform="translate("+dx.toFixed(1)+"vmin,"+dy.toFixed(1)+"vmin) rotate("+(Math.random()*60-30).toFixed(0)+"deg)"; d.style.opacity="0"; });
  setTimeout(()=>d.remove(),580); } }
function showRecipe(dish){
  currentDish=dish; STEPS=dish.steps||SANDWICH_STEPS; chosen=[]; stepIdx=0; CHOSEN_OK={}; PICK={};
  document.getElementById("band").classList.add("hide"); setHead(null);
  show("s-intro");
  // 완성 그림(가운데, 크게) + 요리 이름
  document.getElementById("recipe-hero").innerHTML=`<div>${dish.done?dish.done():wholeSandwich()}</div>`;
  document.getElementById("recipe-name").textContent=dish.nm;
  // 필요한 재료(왼쪽) — 누르면 이름 음성
  const needEl=document.getElementById("recipe-need");
  let needHTML;
  if(dish.freeChoice){ needHTML=`<div class="needchip" data-say="원하는 과일을 모두 골라요"><div class="ic"><div class="cardemoji">🍓</div></div><div>원하는 과일</div></div>`; }
  else { needHTML=dish.need.map(k=>{const p=PANTRY[k];
    const ic=p.img&&IMG[p.img]?`<img src="${IMG[p.img]}">`:`<div class="cardemoji">${p.e}</div>`;
    return `<div class="needchip" data-say="${p.nm}"><div class="ic">${ic}</div><div>${p.nm}</div></div>`;}).join(""); }
  needEl.innerHTML=`<h4>필요한 재료</h4><div class="needrow">${needHTML}</div>`;
  needEl.querySelectorAll(".needchip").forEach(el=>{ el.onclick=()=>{ SND.pop(); say(el.dataset.say); }; });
  // 만드는 순서(오른쪽) — 누르면 문장으로 읽기
  const orderEl=document.getElementById("recipe-order");
  orderEl.innerHTML=`<h4>만드는 순서</h4><div class="orow">`+
    STEPS.map((s,i)=>`<div class="ostep" data-say="${s.text}"><div class="obox">${s.card()}</div><div class="olb">${i+1}. ${s.label}</div></div>`).join("")+`</div>`;
  orderEl.querySelectorAll(".ostep").forEach(el=>{ el.onclick=()=>{ SND.pop(); say(el.dataset.say); }; });
  const line=`'${dish.nm}'를 골랐네요! 요리 하기 전에 필요한 재료와 순서를 확인해 볼까요?`;
  document.getElementById("recipe-say").dataset.say=line;
  say(line);
}

/* 설정 */
function buildSettings(){
  const isBool=k=>/^(sfx|tts|vib|order)$/.test(k);
  function wire(id,key,after){ const seg=document.getElementById(id);
    [...seg.children].forEach(b=>{ b.classList.toggle("on", (isBool(key)?String(+SET[key]):String(SET[key]))===b.dataset.v);
      b.onclick=()=>{ SET[key]=(key==='vol'||key==='fs')?parseFloat(b.dataset.v):(isBool(key)?b.dataset.v==="1":b.dataset.v);
        [...seg.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); settingsSave(); after&&after(); }; }); }
  wire("set-vol","vol",()=>SND.pop());
  wire("set-sfx","sfx",()=>SND.pop());
  wire("set-tts","tts",()=>say("음성 안내를 켰어요."));
  wire("set-vib","vib",()=>vib(40));
  wire("set-voice","voice",()=>say(SET.voice==="male"?"남자 목소리예요.":"여자 목소리예요."));
  wire("set-fs","fs",()=>document.documentElement.style.setProperty("--fsx",SET.fs));
  wire("set-order","order",()=>say(SET.order?"손님 주문을 켰어요.":"손님 주문을 껐어요."));
  renderStudents(); renderCustomers();
}
document.getElementById("nav-set").onclick=()=>{ buildSettings(); document.getElementById("settings").classList.add("on"); };
document.getElementById("set-close").onclick=()=>document.getElementById("settings").classList.remove("on");
document.getElementById("settings").addEventListener("pointerdown",e=>{ if(e.target.id==="settings")e.currentTarget.classList.remove("on"); });
document.getElementById("pop-cook").onclick=()=>{ document.getElementById("cookpop").classList.remove("on"); goPrep("before"); };
document.getElementById("intro-go").onclick=()=>{ openCart(currentDish); };

/* 네비: 이전 / 다시 / 다음 */
function onStep(){ return curScreen()==="s-step"; }
document.getElementById("nav-again").onclick=()=>{
  if(onStep()){ renderStep(); }
  else if(curScreen()==="s-cart"&&currentDish){ buildCart(currentDish); SND.pop(); say("재료를 다시 가져왔어요."); }
  else if(lastSay){ say(lastSay); } };
document.getElementById("nav-next").onclick=()=>{
  const pop=document.getElementById("cookpop"); if(pop.classList.contains("on")){ document.getElementById("pop-cook").click(); return; }
  const s=curScreen();
  if(s==="s-step"){ if(washPhase==="after"){ finishCooking(); } else if(stepIdx<STEPS.length-1){stepIdx++;renderStep();} else goPrep("after"); }
  else if(s==="s-start"){ document.getElementById("btn-start").click(); }
  else if(s==="s-order"){ document.getElementById("order-ok").click(); }
  else if(s==="s-select"){ SND.pop(); say("먼저 요리를 골라요."); }
  else if(s==="s-intro"){ openCart(currentDish); }
  else if(s==="s-cart"){ const cd=document.getElementById("cart-done"); if(cd&&cd.style.display!=="none"&&!cd.disabled){ cd.onclick(); } else { SND.pop(); say("재료를 담아요."); } }
  else if(s==="s-prep"){ SND.good(); if(washPhase==="after"){ finishCooking(); } else { stepIdx=0; renderStep(); } }
  else if(s==="s-done"){ startReview(); }
  else if(s==="s-review"){ const f=document.getElementById("btn-finish"); if(f&&f.style.display!=="none") f.click(); }
};
document.getElementById("nav-prev").onclick=()=>{
  const s=curScreen();
  if(s==="s-step"){ if(washPhase==="after"){ washPhase="before"; stepIdx=STEPS.length-1; renderStep(); } else if(stepIdx>0){stepIdx--;renderStep();} else openCart(currentDish); }
  else if(s==="s-cart"){ currentDish?showRecipe(currentDish):showSelect(); }
  else if(s==="s-intro"){ showSelect(); }
  else if(s==="s-prep"){ openCart(currentDish); }
  else if(s==="s-done"){ stepIdx=STEPS.length-1; renderStep(); }
  else if(s==="s-review"){ finishCooking(); }
  else if(s==="s-select"){ if(SET.order&&ORDER)showOrder(true); else { setHead(null); show("s-start"); } }
  else if(s==="s-order"||s==="s-book"){ setHead(null); show("s-start"); }
  else if(s==="s-edit"){ showSelect(); }
};

/* 배선 */
function applyAssets(){
  if(IMG.kitchenBg) document.documentElement.style.background="#f4efe6 url("+IMG.kitchenBg+") center/cover fixed";
  if(IMG.washimg) document.getElementById("washimg").src=IMG.washimg;
  document.getElementById("hero-start").innerHTML=`<img class="base" src="${IMG.hero}" style="position:absolute;left:34.0%;top:30.5%;width:29.2%;">`;
}
document.getElementById("btn-start").onclick=()=>{ if(SET.order)showOrder(); else { ORDER=null; showSelect(); } };
document.getElementById("order-ok").onclick=()=>{ SND.pop(); showSelect(); };
document.getElementById("nav-home").onclick=()=>{chosen=[];stepIdx=0;document.getElementById("band").classList.add("hide");setHead(null);show("s-start");};
document.getElementById("nav-full").onclick=()=>{const d=document.documentElement;
  if(!document.fullscreenElement){(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);}
  else{(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);}};
document.getElementById("btn-again").onclick=()=>{chosen=[];stepIdx=0; currentDish?openCart(currentDish):showSelect();};
document.getElementById("btn-review").onclick=startReview;
document.getElementById("btn-finish").onclick=()=>{confetti(document.getElementById("s-review"));setHead(null);show("s-start");chosen=[];stepIdx=0;};
document.getElementById("g-say").onclick=()=>say(STEPS[stepIdx].say);

/* ---------- 위치 편집기 ---------- */
(function(){
  const EDITABLE=".drag,.tray-item,.target-out,.plate-stage,.sand,.sidetray,#knife,#dash,#whole,#basket,#sink,#washimg,#sandwich,.lyr,.base,.plate,#hero-start>div";
  let EDIT=false, ESEL=null;
  const info=document.getElementById("editinfo");
  function mark(){ document.querySelectorAll(EDITABLE).forEach(el=>el.setAttribute("data-edit","1")); }
  function hint(){ info.style.display="block"; info.textContent="✏️ 편집 모드 (E=끄기 · C=값복사)\n요소 클릭→드래그/화살표 이동 · +/−·휠 크기"; }
  function pinfo(){ if(!ESEL){hint();return;}
    const p=ESEL.offsetParent||ESEL.parentElement, pr=p.getBoundingClientRect(), r=ESEL.getBoundingClientRect();
    const L=(r.left-pr.left)/pr.width*100, T=(r.top-pr.top)/pr.height*100, W=r.width/pr.width*100, H=r.height/pr.height*100;
    const q=ESEL.id?("#"+ESEL.id):("."+String(ESEL.className||"").split(" ").filter(c=>c&&c!=="ed-sel").join("."));
    info.style.display="block";
    info.textContent=q+"\nleft "+L.toFixed(1)+"%   top "+T.toFixed(1)+"%\nw "+W.toFixed(1)+"%   h "+H.toFixed(1)+"%\n(화살표=이동 · +/−·휠=크기 · E=끄기 · C=복사)"; }
  function pick(el){ if(ESEL)ESEL.classList.remove("ed-sel"); ESEL=el; el.classList.add("ed-sel"); pinfo(); }
  function setEdit(on){ EDIT=on; document.body.classList.toggle("editing",EDIT);
    if(EDIT){ mark(); hint(); }
    else { if(ESEL)ESEL.classList.remove("ed-sel"); ESEL=null; info.style.display="none";
      document.querySelectorAll("[data-edit]").forEach(el=>el.removeAttribute("data-edit")); } }
  document.addEventListener("click",e=>{ if(!EDIT)return;
    const t=e.target.closest(EDITABLE); if(t){ e.preventDefault(); e.stopPropagation(); } }, true);
  // 마우스/터치로 끌어서 이동
  let dEl=null,dpr=null,dsx=0,dsy=0,dl=0,dt=0;
  document.addEventListener("pointerdown",e=>{ if(!EDIT)return;
    const t=e.target.closest(EDITABLE); if(!t)return; e.preventDefault(); e.stopPropagation();
    pick(t); const p=t.offsetParent||t.parentElement; dpr=p.getBoundingClientRect();
    const r=t.getBoundingClientRect(); dl=(r.left-dpr.left)/dpr.width*100; dt=(r.top-dpr.top)/dpr.height*100;
    dsx=e.clientX; dsy=e.clientY; dEl=t;
    t.style.position="absolute"; t.style.right="auto"; t.style.transform="none";
    try{t.setPointerCapture(e.pointerId);}catch(_){}
  }, true);
  document.addEventListener("pointermove",e=>{ if(!EDIT||!dEl||!dpr.width||!dpr.height)return; e.preventDefault(); e.stopPropagation();
    const nl=dl+(e.clientX-dsx)/dpr.width*100, nt=dt+(e.clientY-dsy)/dpr.height*100;
    if(!isFinite(nl)||!isFinite(nt))return;
    dEl.style.left=nl.toFixed(1)+"%"; dEl.style.top=nt.toFixed(1)+"%"; pinfo();
  }, true);
  document.addEventListener("pointerup",e=>{ if(EDIT&&dEl){ e.stopPropagation(); dEl=null; } }, true);
  function resizeSel(deltaPct){ if(!ESEL)return;
    const p=ESEL.offsetParent||ESEL.parentElement, pr=p.getBoundingClientRect(), r=ESEL.getBoundingClientRect();
    const W=Math.max(2,(r.width/pr.width*100)+deltaPct);
    ESEL.style.width=W.toFixed(1)+"%"; ESEL.style.height="auto"; pinfo(); }
  document.addEventListener("keydown",e=>{
    if(e.key==="e"||e.key==="E"){ setEdit(!EDIT); return; }   // E = 편집 켜기/끄기
    if(!EDIT)return;
    if(e.key==="c"||e.key==="C"){ copyVals(); return; }        // C = 값 복사
    if(!ESEL)return;
    if(/^[+=\-_\[\]]$/.test(e.key)){ e.preventDefault();   // 크기 조절: + / - (또는 [ ]), Shift=크게
      const big=e.shiftKey?6:2; resizeSel((e.key==="-"||e.key==="_"||e.key==="[")?-big:big); return; }
    if(!/^Arrow/.test(e.key))return; e.preventDefault();
    const d=e.shiftKey?5:1, p=ESEL.offsetParent||ESEL.parentElement, pr=p.getBoundingClientRect(), r=ESEL.getBoundingClientRect();
    let L=(r.left-pr.left)/pr.width*100, T=(r.top-pr.top)/pr.height*100;
    if(e.key==="ArrowLeft")L-=d; if(e.key==="ArrowRight")L+=d; if(e.key==="ArrowUp")T-=d; if(e.key==="ArrowDown")T+=d;
    ESEL.style.position="absolute"; ESEL.style.right="auto"; ESEL.style.transform="none";
    ESEL.style.left=L.toFixed(1)+"%"; ESEL.style.top=T.toFixed(1)+"%"; pinfo(); }, true);
  document.addEventListener("wheel",e=>{ if(!EDIT||!ESEL)return; e.preventDefault(); resizeSel(e.deltaY<0?2:-2); }, {passive:false});
  setInterval(()=>{ if(EDIT) mark(); }, 500);
  // 현재 화면의 모든 위치 요소 값 복사(C키)
  function copyVals(){
    const out=[]; document.querySelectorAll(EDITABLE).forEach(el=>{
      const p=el.offsetParent||el.parentElement; if(!p)return; const pr=p.getBoundingClientRect(), r=el.getBoundingClientRect();
      if(!pr.width||!pr.height||!r.width)return;
      const q=el.id?("#"+el.id):("."+String(el.className||"").split(" ").filter(c=>c&&c!=="ed-sel").join("."));
      out.push(q+":  left "+((r.left-pr.left)/pr.width*100).toFixed(1)+"%  top "+((r.top-pr.top)/pr.height*100).toFixed(1)
        +"%  w "+(r.width/pr.width*100).toFixed(1)+"%  h "+(r.height/pr.height*100).toFixed(1)+"%"); });
    const txt="["+curScreen()+(onStep()?(" 단계"+(stepIdx+1)):"")+"]\n"+out.join("\n");
    try{ navigator.clipboard.writeText(txt); }catch(_){}
    console.log(txt); info.style.display="block"; info.textContent="복사됨! 채팅에 붙여넣어 주세요.\n\n"+txt;
  }
  if(/[?&]edit/.test(location.search)) setEdit(true);  // ?edit URL 이면 편집 모드로 시작(미리보기 전용)
})();

/* ===== 테스트 훅 ===== */
window.__T={ get STEPS(){return STEPS;}, get stepIdx(){return stepIdx;}, get chosen(){return chosen;},

applyAssets(); renderChefs(); renderNavChef();

console.assert(typeof N==="function"&&N(10)>=2,"수준 N()");
</script>
